<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b37"><title>Suivi de chantier · Prototype</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#152b34;background:#f3f6f7}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}header{background:#102b37;color:white;padding:17px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}header small{color:#b8d4dd}.shell{max-width:1100px;margin:auto}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolbar button,.btn{border:1px solid #c7d6db;border-radius:11px;background:white;padding:10px 13px;color:#163640}.btn.primary{background:#008d91;border-color:#008d91;color:white}.btn.danger{color:#ae3030}.btn:disabled{opacity:.45}main{padding:20px 16px 100px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button{padding:10px 14px;border-radius:12px;border:1px solid #d7e1e4;background:white}.tabs button.active{background:#d9f3f1;border-color:#008d91;color:#006b6e;font-weight:700}.card{background:white;border:1px solid #dce5e8;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #102b3708}.muted{color:#667e86;font-size:13px}.pill{display:inline-block;border-radius:999px;background:#eaf0f2;padding:5px 9px;font-size:12px}.urgent{background:#ffe8e7;color:#a32323}.good{background:#d9f5e8;color:#14694d}.warn{background:#fff2d8;color:#8c5a00}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.stack{display:grid;gap:10px}.field{display:grid;gap:5px;margin:10px 0}.field input,.field textarea,.field select{width:100%;border:1px solid #cbd9de;border-radius:10px;padding:11px;background:white}.field textarea{min-height:85px}h1{font-size:23px;margin:0 0 12px}h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:8px 0}.listitem{border-top:1px solid #e8eff1;padding:12px 0}.listitem:first-child{border-top:0}.click{cursor:pointer}.photo{width:100%;height:120px;object-fit:cover;border-radius:10px;background:#e6edef}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:9px}.photos img{width:100%;height:110px;object-fit:cover;border-radius:10px}.msg{border-left:3px solid #b4d9dc;padding:10px 12px;margin:9px 0;background:#f6fafb;border-radius:0 10px 10px 0}.overlay{position:fixed;inset:0;background:#071c259c;display:grid;place-items:center;z-index:30;padding:14px}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:white;border-radius:18px;padding:20px}.notice{background:#fff4d8;padding:10px 14px;border-radius:10px;margin:10px 0}.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dce5e8;display:flex;justify-content:center;gap:5px;padding:8px 8px max(8px,env(safe-area-inset-bottom));z-index:10}.footer button{border:0;background:transparent;padding:9px 12px;border-radius:10px}.footer button.active{background:#d9f3f1;color:#006b6e;font-weight:700}.small{font-size:12px}.check{accent-color:#008d91}#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#102b37;color:white;padding:10px 16px;border-radius:12px;display:none;z-index:40;max-width:90%}@media(max-width:600px){header{padding:12px}main{padding:14px 12px 90px}.toolbar button{padding:8px}.footer button{font-size:12px;padding:8px}.card{padding:13px}}
</style></head><body><header><div><strong id="brand">Suivi de chantier</strong><br><small>Prototype local · sans serveur</small></div><div class="toolbar"><select id="role" aria-label="Rôle"><option value="boss">👷 Responsable</option><option value="worker">🦺 Ouvrier</option></select><button class="btn" id="reset" title="Réinitialiser les données">↺</button></div></header><div class="shell"><main id="app"></main></div><nav class="footer" id="nav"></nav><div id="toast"></div><script>
const KEY='chantier_demo_v1';const seed=()=>({company:{name:'Entreprise Démo',contact:'contact@entreprise.fr',logo:''},workers:[{id:1,name:'Thomas'},{id:2,name:'Lucas'}],sites:[{id:1,name:'Maison Dupont',address:'12 rue des Tilleuls, Paris',status:'En cours',days:['2026-11-09','2026-11-10'],members:[1,2],tasks:[{id:1,text:'Installation des rails',status:'Terminé'},{id:2,text:'Passage des câbles',status:'En cours'},{id:3,text:'Contrôle final',status:'À faire'}],messages:[{id:1,author:'Thomas',date:new Date().toISOString(),text:'Rails installés dans le séjour.',day:'2026-11-09',kind:'observation'}],problems:[{id:1,text:'Arrivée électrique à vérifier',urgent:true,resolved:false,author:'Lucas',date:new Date().toISOString()}],reports:[]},{id:2,name:'Rénovation Atelier',address:'5 avenue du Parc, Lyon',status:'À faire',days:['2026-11-12'],members:[1],tasks:[{id:4,text:'Préparer le matériel',status:'À faire'}],messages:[],problems:[],reports:[]}],finalReports:[]});let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch{db=seed()}let role='boss',tab='home',siteId=null,sub='tasks',modal=null,expandedProblem=null,reportDay=null,reportDraft=null,reportPhotos=[],workerId=1;const $=s=>document.querySelector(s);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{toast('Stockage saturé : réduisez le nombre de photos')}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const site=()=>db.sites.find(x=>x.id===siteId);const stamp=d=>new Date(d).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});const date=d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{dateStyle:'medium'});const today=()=>new Date().toISOString().slice(0,10);const id=()=>Date.now()+Math.floor(Math.random()*10000);const toast=s=>{let e=$('#toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',3000)};const btn=(label,action,cls='')=>`<button class="btn ${cls}" onclick="${action}">${label}</button>`;const progress=s=>s.tasks.length?Math.round(s.tasks.filter(t=>t.status==='Terminé').length*100/s.tasks.length):null;const names=s=>s.members.map(n=>db.workers.find(w=>w.id===n)?.name).filter(Boolean).join(', ');function render(){let nav=role==='boss'?[['home','Accueil'],['sites','Chantiers'],['team','Équipe'],['reports','Rapports'],['settings','Entreprise']]:[['home','Accueil'],['sites','Chantiers'],['alerts','Notifications'],['profile','Profil']];$('#nav').innerHTML=nav.map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');$('#brand').textContent=db.company.name;$('#role').value=role;$('#app').innerHTML=(siteId?siteView():tab==='home'?home():tab==='sites'?sitesView():tab==='team'?teamView():tab==='reports'?reportsView():tab==='settings'?settingsView():tab==='alerts'?alertsView():profileView())+(modal?modalView():'');}function go(t){tab=t;siteId=null;modal=null;render()}function openSite(i){siteId=i;sub='tasks';tab='sites';render()}function home(){let items=role==='boss'?db.sites:db.sites.filter(s=>s.members.includes(workerId));return `<h1>${role==='boss'?'Tableau de bord':'Mes chantiers'}</h1>${role==='boss'?`<div class="grid"><div class="card"><h2>${db.sites.length} chantiers</h2><span class="muted">Suivi global</span></div><div class="card"><h2>${db.sites.reduce((n,s)=>n+s.problems.filter(p=>!p.resolved).length,0)} problèmes ouverts</h2><span class="muted">À traiter</span></div><div class="card"><h2>${db.sites.reduce((n,s)=>n+s.reports.filter(r=>!r.validated).length,0)} brouillons</h2><span class="muted">Rapports à valider</span></div></div>`:''}<h2>${role==='boss'?'Chantiers récents':'Chantiers affectés'}</h2>${items.map(s=>siteCard(s)).join('')||'<p>Aucun chantier affecté.</p>'}`;}function siteCard(s){return `<div class="card click" onclick="openSite(${s.id})"><div class="row"><strong>${esc(s.name)}</strong><span class="pill ${s.status==='Terminé'?'good':''}">${s.status}</span></div><p class="muted">${esc(s.address)}</p><div class="row"><small>${s.days.map(date).join(' · ')}</small><strong>${progress(s)===null?'—':progress(s)+' %'}</strong></div>${s.problems.some(p=>!p.resolved&&p.urgent)?'<p class="urgent pill">⚠ Problème urgent</p>':''}</div>`}function sitesView(){let list=role==='boss'?db.sites:db.sites.filter(s=>s.members.includes(workerId));return `<div class="row"><h1>Chantiers</h1>${role==='boss'?btn('+ Nouveau chantier','showModal("newsite")','primary'):''}</div>${list.map(siteCard).join('')||'<p>Aucun chantier.</p>'}`;}function siteView(){let s=site();if(!s)return '';let tabs=[['tasks','Consignes'],['chat','Conversation'],['problems','Problèmes'],['gallery','Photos'],['planning','Planning']];if(role==='boss')tabs.push(['daily','Rapports']);return `<div class="row">${btn('← Retour','back()')}<span class="pill">${s.status}</span></div><h1 style="margin-top:14px">${esc(s.name)}</h1><p class="muted">${esc(s.address)} · ${esc(names(s))}</p><div class="row"><span>${progress(s)===null?'Aucune consigne':progress(s)+' % des consignes terminées'}</span>${role==='boss'?btn('Modifier','showModal("editsite")'):''}</div><div class="tabs">${tabs.map(([k,v])=>`<button class="${sub===k?'active':''}" onclick="sub='${k}';render()">${v}</button>`).join('')}</div>${sub==='tasks'?tasks(s):sub==='chat'?chat(s):sub==='problems'?problems(s):sub==='gallery'?gallery(s):sub==='planning'?planning(s):daily(s)}${role==='boss'?`<div class="card row">${btn('Clôturer le chantier','showModal("close")','danger')}</div>`:''}`;}function back(){siteId=null;render()}function tasks(s){return `<div class="card"><div class="row"><h2>Consignes</h2>${role==='boss'?btn('+ Ajouter','showModal("newtask")','primary'):''}</div>${s.tasks.map((t,i)=>`<div class="listitem row"><div style="flex:1"><strong>${esc(t.text)}</strong></div><select onchange="setTask(${t.id},this.value)">${['À faire','En cours','Terminé'].map(v=>`<option ${t.status===v?'selected':''}>${v}</option>`).join('')}</select>${role==='boss'?`<div class="toolbar">${btn('↑',`moveTask(${i},-1)`)}${btn('↓',`moveTask(${i},1)`)}${btn('✎',`editTask(${t.id})`)}</div>`:''}</div>`).join('')||'<p class="muted">Aucune consigne.</p>'}</div>`}function setTask(i,v){let s=site(),t=s.tasks.find(t=>t.id===i);t.status=v;if(s.status==='À faire')s.status='En cours';save();render()}function moveTask(i,dir){let a=site().tasks,j=i+dir;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}function editTask(i){modal={type:'edittask',id:i};render()}function chat(s){return `<div class="card"><h2>Conversation du chantier</h2>${s.messages.map(m=>`<div class="msg"><div class="row"><strong>${esc(m.author)}</strong><span class="muted">${stamp(m.date)} · ${esc(m.day||'')}</span></div><p>${esc(m.text)}</p>${m.image?`<img class="photo" style="max-width:260px" src="${m.image}">`:''}${m.audio?`<audio controls src="${m.audio}" style="width:100%"></audio>`:''}${m.kind==='problem'?'<span class="pill urgent">Problème</span>':''}</div>`).join('')||'<p class="muted">Aucun message pour le moment.</p>'}<div class="field"><label>Votre observation</label><textarea id="msgtext" placeholder="Écrire un message..."></textarea></div><div class="row"><input type="date" id="msgday" value="${today()}">${btn('Envoyer','sendMsg()','primary')}${btn('+ Photo','showModal("photo")')}${btn('🎤 Vocal','showModal("voice")')}${btn('⚠ Problème','showModal("problem")')}</div></div>`}function sendMsg(){let t=$('#msgtext').value.trim();if(!t)return;let s=site();s.messages.push({id:id(),author:role==='boss'?'Responsable':db.workers.find(w=>w.id===workerId)?.name,date:new Date().toISOString(),day:$('#msgday').value,text:t,kind:'observation'});if(s.status==='À faire')s.status='En cours';save();render()}function problems(s){let sorted=[...s.problems].sort((a,b)=>Number(a.resolved)-Number(b.resolved)||Number(b.urgent)-Number(a.urgent));return `<div class="card"><div class="row"><h2>Problèmes</h2>${btn('+ Signaler','showModal("problem")','primary')}</div>${sorted.map(p=>`<div class="listitem"><div class="row"><strong>${p.urgent?'⚠ ':''}${esc(p.text.slice(0,85))}</strong><span class="pill ${p.resolved?'good':p.urgent?'urgent':'warn'}">${p.resolved?'Résolu':p.urgent?'Urgent':'Non résolu'}</span></div><div class="row"><span class="muted">${esc(p.author)} · ${stamp(p.date)}</span>${btn(expandedProblem===p.id?'Réduire':'Détails',`expandedProblem=${expandedProblem===p.id?'null':p.id};render()`)}</div>${expandedProblem===p.id?`<p>${esc(p.text)}</p>${p.image?`<img class="photo" style="max-width:260px" src="${p.image}">`:''}${p.comment?`<p><strong>Commentaire :</strong> ${esc(p.comment)}</p>`:''}${role==='boss'?btn(p.resolved?'Rouvrir':'Marquer résolu',`resolveProblem(${p.id})`,p.resolved?'':'primary'):''}</div>`:''}</div>`).join('')||'<p>Aucun problème.</p>'}</div>`}function resolveProblem(i){let p=site().problems.find(p=>p.id===i);p.resolved=!p.resolved;if(p.resolved)p.comment=prompt('Commentaire de résolution (facultatif) :')||'';save();render()}function gallery(s){let pics=[...s.messages.filter(m=>m.image).map(m=>({image:m.image,text:m.text})),...s.problems.filter(p=>p.image).map(p=>({image:p.image,text:p.text}))];return `<div class="card"><h2>Galerie photos</h2><div class="photos">${pics.map(p=>`<a href="${p.image}" target="_blank"><img src="${p.image}" alt="${esc(p.text)}"></a>`).join('')}</div>${pics.length?'':'<p class="muted">Aucune photo.</p>'}</div>`}function planning(s){return `<div class="card"><h2>Jours de chantier</h2>${s.days.map(d=>`<div class="listitem row"><strong>${date(d)}</strong><span class="muted">${esc(names(s))}</span></div>`).join('')}</div>`}function daily(s){return `<div class="card"><h2>Rapports journaliers</h2><p class="muted">Un brouillon est possible uniquement lorsqu'une observation écrite a été enregistrée pour la journée.</p>${[...new Set([...s.days,...s.messages.map(m=>m.day).filter(Boolean)])].sort().map(d=>`<div class="listitem row"><div><strong>${date(d)}</strong><div class="muted">${s.messages.filter(m=>m.day===d).length} observations</div></div>${s.messages.some(m=>m.day===d)?btn('Préparer / Voir',`prepareReport('${d}')`):'<span class="muted">Aucun rapport</span>'}</div>`).join('')}</div>`}function prepareReport(d){reportDay=d;let s=site(),old=s.reports.find(r=>r.day===d);reportDraft=old?structuredClone(old):{day:d,work:s.messages.filter(m=>m.day===d&&m.kind==='observation').map(m=>m.text).join('\n'),issues:s.problems.filter(p=>p.date.slice(0,10)===d).map(p=>p.text).join('\n'),notes:'',photos:[],validated:false};reportPhotos=reportDraft.photos||[];modal={type:'report'};render()}function reportsView(){return `<h1>Rapports PDF</h1><p class="muted">Les rapports sont réservés au responsable.</p>${db.finalReports.map(r=>`<div class="card row"><strong>${esc(r.name)}</strong>${btn('Télécharger',`downloadSaved(${r.id})`)}</div>`).join('')||'<div class="card">Aucun rapport final conservé.</div>'}`;}function teamView(){return `<div class="row"><h1>Équipe</h1>${btn('+ Ouvrier','showModal("worker")','primary')}</div>${db.workers.map(w=>`<div class="card row"><strong>${esc(w.name)}</strong><div class="toolbar">${btn('Renommer',`renameWorker(${w.id})`)}${btn('SMS invitation',`invite(${w.id})`)}</div></div>`).join('')}`}function renameWorker(i){let w=db.workers.find(w=>w.id===i),n=prompt('Nom de l’ouvrier :',w.name);if(n?.trim()){w.name=n.trim();save();render()}}function invite(i){let w=db.workers.find(w=>w.id===i);alert('Démonstration : aucun compte réel ni lien sécurisé n’est créé. La fonction SMS sera disponible dans la version connectée.')}function settingsView(){return `<h1>Entreprise</h1><div class="card"><div class="field"><label>Nom de l’entreprise</label><input id="company" value="${esc(db.company.name)}"></div><div class="field"><label>Coordonnées</label><input id="contact" value="${esc(db.company.contact)}"></div>${btn('Enregistrer','saveCompany()','primary')}</div><div class="card"><h2>Mode démonstration</h2><p>Les données restent sur cet appareil et dans ce navigateur. Aucun serveur, compte réel, notification push, SMS, synchronisation entre appareils ou stockage cloud.</p></div>`}function saveCompany(){db.company.name=$('#company').value;db.company.contact=$('#contact').value;save();render()}function alertsView(){return `<h1>Notifications</h1><div class="card">Les alertes push et la synchronisation nécessitent la future version connectée.</div>`}function profileView(){return `<h1>Profil ouvrier</h1><div class="card"><label>Ouvrier simulé</label><select onchange="workerId=Number(this.value);render()">${db.workers.map(w=>`<option value="${w.id}" ${w.id===workerId?'selected':''}>${esc(w.name)}</option>`).join('')}</select><p class="muted">Le changement de profil simule les accès sans authentification réelle.</p></div>`}function showModal(type){modal={type};render()}function closeModal(){modal=null;render()}function modalView(){let t=modal.type;let content=t==='newsite'?`<h2>Nouveau chantier</h2>${field('Nom','name')}${field('Adresse','address')}${field('Dates (AAAA-MM-JJ, séparées par des virgules)','days')}${btn('Créer','createSite()','primary')}`:t==='editsite'?`<h2>Modifier le chantier</h2>${field('Nom','name',site().name)}${field('Adresse','address',site().address)}${field('Dates','days',site().days.join(', '))}<div class="field"><label>Équipe affectée</label>${db.workers.map(w=>`<label><input type="checkbox" class="member" value="${w.id}" ${site().members.includes(w.id)?'checked':''}> ${esc(w.name)}</label>`).join('')}</div>${btn('Enregistrer','editSite()','primary')}`:t==='newtask'||t==='edittask'?`<h2>${t==='newtask'?'Nouvelle consigne':'Modifier la consigne'}</h2>${field('Description','task',t==='edittask'?site().tasks.find(x=>x.id===modal.id).text:'')}${btn('Enregistrer','saveTask()','primary')}`:t==='problem'?`<h2>Signaler un problème</h2>${area('Description','problem')}<div class="field"><label>Photo facultative</label><input type="file" accept="image/*" id="file"></div><label><input type="checkbox" id="urgent"> Urgent</label><p>${btn('Signaler','sendProblem()','primary')}</p>`:t==='photo'?`<h2>Ajouter une photo</h2><div class="field"><label>Prendre ou choisir des photos</label><input id="file" type="file" accept="image/*" multiple></div>${area('Commentaire facultatif','caption')}${btn('Envoyer','sendPhotos()','primary')}`:t==='voice'?`<h2>Message vocal</h2><p class="muted">Enregistrement local avec l’autorisation du microphone. Prévisualisation avant envoi.</p><div class="toolbar">${btn('● Enregistrer','startAudio()')}${btn('■ Arrêter','stopAudio()')}${btn('Envoyer','sendAudio()','primary')}</div><div id="audioPreview"></div>`:t==='worker'?`<h2>Ajouter un ouvrier</h2>${field('Nom','worker')}${btn('Ajouter','addWorker()','primary')}`:t==='report'?`<h2>Rapport du ${date(reportDay)}</h2>${area('Travaux réalisés','work',reportDraft.work)}${area('Problèmes rencontrés','issues',reportDraft.issues)}${area('Observations complémentaires / résumé manuel des vocaux','notes',reportDraft.notes)}<h3>Photos à inclure</h3>${site().messages.filter(m=>m.image).map(m=>`<label style="display:inline-grid;width:110px;margin:5px"><img src="${m.image}" class="photo"><input class="reportpic" type="checkbox" value="${m.id}" ${reportPhotos.includes(m.id)?'checked':''}> Inclure</label>`).join('')||'<p class="muted">Aucune photo</p>'}<p>${btn('Enregistrer brouillon','saveReport(false)')}${btn('Valider et PDF','saveReport(true)','primary')}</p>`:t==='close'?`<h2>Vérification avant clôture</h2><p><strong>${esc(site().name)}</strong></p><p>Consignes inachevées : <strong>${site().tasks.filter(t=>t.status!=='Terminé').length}</strong></p><p>Problèmes non résolus : <strong>${site().problems.filter(p=>!p.resolved).length}</strong></p><p>Rapports journaliers non validés : <strong>${site().reports.filter(r=>!r.validated).length}</strong></p><div class="notice"><strong>Suppression définitive :</strong> les consignes, conversations, photos et problèmes seront supprimés de ce navigateur. Seul le PDF final sera conservé comme fichier téléchargé et comme entrée locale du prototype.</div><label><input type="checkbox" id="confirmclose"> Je comprends que les données du chantier seront supprimées.</label><p>${btn('Clôturer définitivement','closeSite()','danger')}</p>`:'';return `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row"><span class="muted">Prototype local</span>${btn('✕ Fermer','closeModal()')}</div>${content}</div></div>`}const field=(label,name,value='')=>`<div class="field"><label>${label}</label><input id="${name}" value="${esc(value)}"></div>`;const area=(label,name,value='')=>`<div class="field"><label>${label}</label><textarea id="${name}">${esc(value)}</textarea></div>`;function createSite(){let n=$('#name').value.trim();if(!n)return toast('Nom requis');let days=$('#days').value.split(',').map(x=>x.trim()).filter(x=>/^\d{4}-\d\d-\d\d$/.test(x));let s={id:id(),name:n,address:$('#address').value,status:'À faire',days,members:db.workers.map(w=>w.id),tasks:[],messages:[],problems:[],reports:[]};db.sites.push(s);save();modal=null;openSite(s.id)}function editSite(){let s=site();s.name=$('#name').value;s.address=$('#address').value;s.days=$('#days').value.split(',').map(x=>x.trim()).filter(Boolean);s.members=[...document.querySelectorAll('.member:checked')].map(x=>Number(x.value));save();closeModal()}function saveTask(){let v=$('#task').value.trim();if(!v)return;let s=site();if(modal.type==='newtask')s.tasks.push({id:id(),text:v,status:'À faire'});else s.tasks.find(x=>x.id===modal.id).text=v;save();closeModal()}function addWorker(){let n=$('#worker').value.trim();if(!n)return;db.workers.push({id:id(),name:n});save();closeModal()}function author(){return role==='boss'?'Responsable':db.workers.find(w=>w.id===workerId)?.name||'Ouvrier'}async function resizeImage(file){return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let scale=Math.min(1,1200/img.width,1200/img.height),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.68))};img.onerror=reject;img.src=url})}async function sendPhotos(){let files=[...$('#file').files];if(!files.length)return toast('Choisissez une photo');let s=site(),caption=$('#caption').value;for(let f of files){let image=await resizeImage(f);s.messages.push({id:id(),author:author(),date:new Date().toISOString(),day:today(),text:caption,kind:'photo',image})}if(s.status==='À faire')s.status='En cours';save();closeModal()}async function sendProblem(){let text=$('#problem').value.trim();if(!text)return toast('Description requise');let file=$('#file').files[0],image=file?await resizeImage(file):null,s=site(),p={id:id(),text,urgent:$('#urgent').checked,resolved:false,author:author(),date:new Date().toISOString(),image};s.problems.push(p);s.messages.push({id:id(),author:author(),date:p.date,day:today(),text,kind:'problem',image});if(s.status==='À faire')s.status='En cours';save();closeModal()}let recorder=null,chunks=[],audioData=null;async function startAudio(){try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);chunks=[];audioData=null;recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{let blob=new Blob(chunks,{type:recorder.mimeType});let reader=new FileReader;reader.onload=()=>{audioData=reader.result;let e=$('#audioPreview');if(e)e.innerHTML=`<audio controls src="${audioData}" style="width:100%"></audio>`};reader.readAsDataURL(blob);stream.getTracks().forEach(t=>t.stop())};recorder.start();toast('Enregistrement en cours')}catch{toast('Microphone indisponible : essayez via HTTPS')}}function stopAudio(){if(recorder?.state==='recording')recorder.stop()}function sendAudio(){if(!audioData)return toast('Enregistrez puis arrêtez le vocal');let s=site();s.messages.push({id:id(),author:author(),date:new Date().toISOString(),day:today(),text:'Message vocal',kind:'voice',audio:audioData});if(s.status==='À faire')s.status='En cours';save();closeModal()}function saveReport(validated){let s=site(),r={day:reportDay,work:$('#work').value,issues:$('#issues').value,notes:$('#notes').value,photos:[...document.querySelectorAll('.reportpic:checked')].map(e=>Number(e.value)),validated};s.reports=s.reports.filter(x=>x.day!==reportDay);s.reports.push(r);save();if(validated)printReport(s,r);closeModal()}function printReport(s,r,final=false){let imgs=r.photos.map(i=>s.messages.find(m=>m.id===i)?.image).filter(Boolean);let html=`<!doctype html><html lang="fr"><meta charset="utf-8"><title>Rapport - ${esc(s.name)}</title><style>body{font-family:Arial,sans-serif;color:#20343d;margin:35px}header{border-bottom:3px solid #008d91;padding-bottom:14px}h1{font-size:24px}h2{font-size:17px;margin-top:25px}p{white-space:pre-wrap;line-height:1.5}.gallery{display:flex;flex-wrap:wrap;gap:10px}.gallery img{max-width:48%;max-height:300px;object-fit:contain;page-break-inside:avoid}@media print{button{display:none}}</style><header><strong>${esc(db.company.name)}</strong><p>${esc(db.company.contact)}</p></header><h1>${final?'Rapport final':'Rapport journalier'}</h1><p><b>Chantier :</b> ${esc(s.name)}<br><b>Adresse :</b> ${esc(s.address)}<br><b>Date :</b> ${final?new Date().toLocaleDateString('fr-FR'):date(r.day)}</p><h2>Travaux réalisés</h2><p>${esc(r.work)}</p><h2>Problèmes rencontrés</h2><p>${esc(r.issues)}</p><h2>Observations complémentaires</h2><p>${esc(r.notes)}</p><h2>Photographies</h2><div class="gallery">${imgs.map(src=>`<img src="${src}">`).join('')}</div><script>window.onload=()=>setTimeout(()=>window.print(),350)<\/script></html>`;let w=window.open('','_blank');if(!w){toast('Autorisez les fenêtres pop-up pour exporter le PDF');return}w.document.write(html);w.document.close()}function closeSite(){if(!$('#confirmclose').checked)return toast('Cochez la confirmation');let s=site();let r={day:today(),work:s.messages.filter(m=>m.kind==='observation').map(m=>m.text).join('\n')||'Aucune observation écrite.',issues:s.problems.map(p=>`${p.resolved?'Résolu':'Non résolu'} : ${p.text}`).join('\n'),notes:s.tasks.filter(t=>t.status!=='Terminé').map(t=>`Consigne restante : ${t.text}`).join('\n'),photos:[],validated:true};printReport(s,r,true);db.finalReports.push({id:id(),name:s.name,summary:r,company:db.company.name});db.sites=db.sites.filter(x=>x.id!==s.id);save();siteId=null;modal=null;tab='reports';render();toast('Chantier clôturé : imprimez ou enregistrez le PDF ouvert')}function downloadSaved(i){let r=db.finalReports.find(x=>x.id===i);if(!r)return;let s={name:r.name,address:'',messages:[]};printReport(s,r.summary,true)}$('#role').onchange=e=>{role=e.target.value;tab='home';siteId=null;modal=null;render()};$('#reset').onclick=()=>{if(confirm('Réinitialiser toutes les données de démonstration sur cet appareil ?')){db=seed();save();siteId=null;tab='home';render()}};window.addEventListener('online',()=>toast('Connexion retrouvée (prototype sans synchronisation)'));render();
</script></body></html>
